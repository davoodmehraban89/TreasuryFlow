name: V6 isolated test assertion triage (NOT V7)
on:
  push:
    branches: ['ci/public-windows-bridge-probe-20261017']
    paths: ['.github/workflows/v6-isolated-failure-triage-once.yml']
permissions:
  contents: read
concurrency:
  group: treasuryflow-v6-assertion-triage-once
  cancel-in-progress: false
jobs:
  diagnose:
    name: Isolated Windows 2022 private V6 test triage
    runs-on: windows-2022
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh
    env:
      BANK_ADAPTER_MODE: disabled
      TREASURYFLOW_ENABLE_MAYAN_EXTERNAL_READ: '0'
      TREASURYFLOW_MAYAN_ENABLE_EXTERNAL_READ: '0'
      TREASURYFLOW_ENABLE_SQL_LAB: '0'
      TREASURYFLOW_DESKTOP_LOCAL: '1'
    steps:
      - name: Validate and extract approved private ZIP
        env:
          GH_TOKEN: ${{ secrets.TF_VALIDATION_READ_TOKEN }}
        run: |
          $ErrorActionPreference='Stop'
          if ([string]::IsNullOrWhiteSpace($env:GH_TOKEN)) { throw 'TOKEN_MISSING' }
          $zip=Join-Path $env:RUNNER_TEMP 'TreasuryFlow_Validation_Staging_20261017.zip'
          $root=Join-Path $env:RUNNER_TEMP 'tf-source'
          gh release download validation-inputs-20261017 --repo davoodmehraban89/TreasuryFlow-Validation-Private --pattern TreasuryFlow_Validation_Staging_20261017.zip --dir $env:RUNNER_TEMP 1>$null 2>$null
          if($LASTEXITCODE -ne 0){throw 'DOWNLOAD_FAILED'}
          if((Get-FileHash $zip -Algorithm SHA256).Hash -ine '9ce46ce2d2a437e08cbf28146b2cf2ac0ed078c71f1aeb537764390cdd3c552f'){throw 'ZIP_HASH_MISMATCH'}
          Expand-Archive -LiteralPath $zip -DestinationPath $root -Force
          if(!(Test-Path -LiteralPath (Join-Path $root 'package.json'))){throw 'INVALID_ROOT'}
          "TF_STAGE=$root" >> $env:GITHUB_ENV
          Write-Host 'PRIVATE_ZIP_SHA256_PASS'
      - name: Install Node 22 without private token
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reproduce unit assertion and emit only finite safe classification tags
        run: |
          $ErrorActionPreference='Continue'
          $PSNativeCommandUseErrorActionPreference=$false
          Set-Location -LiteralPath $env:TF_STAGE
          $install=Join-Path $env:RUNNER_TEMP 'private-npm-install.log'
          npm ci --no-audit --no-fund *> $install
          if($LASTEXITCODE -ne 0){throw 'PRIVATE_NPM_INSTALL_FAILED'}
          Write-Host 'GATE_PASS_NPM_CI'
          $report=Join-Path $env:RUNNER_TEMP 'private-tests.json'
          $output=Join-Path $env:RUNNER_TEMP 'private-tests-console.txt'
          npm test -- --reporter=json "--outputFile=$report" *> $output
          $testExit=$LASTEXITCODE
          if(!(Test-Path -LiteralPath $report)){throw 'TEST_JSON_NOT_PRODUCED'}
          @'
          import fs from 'node:fs';
          import path from 'node:path';
          const report=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          const suites=(report.testResults||[]);
          const fails=suites.flatMap(s=>(s.assertionResults||[]).filter(a=>a.status==='failed'));
          console.log('SUMMARY tests='+Number(report.numTotalTests||0)+' passed='+Number(report.numPassedTests||0)+' failed='+Number(report.numFailedTests||0)+' pending='+Number(report.numPendingTests||0)+' todo='+Number(report.numTodoTests||0));
          console.log('FAILURE_COUNT='+fails.length);
          const known=['textarea','select','editable','placeholder','copy','clipboard','sql','query','readonly','read-only','aria','button','role','tab','value','defaultvalue','data-testid','outerhtml','attribute','textcontent'];
          const detect=s=>known.filter(k=>s.toLowerCase().includes(k));
          for(const fail of fails.slice(0,4)){
            const msg=(fail.failureMessages||[]).join(' ');
            const safeTitle=/^[a-zA-Z0-9 ,.()!?-]{1,120}$/.test(fail.title||'')?fail.title:'[REDACTED]';
            console.log('FAIL_TEST_TITLE='+safeTitle);
            console.log('FAIL_ERROR_CLASS='+(msg.match(/(AssertionError|TypeError|ReferenceError|SyntaxError|RangeError|TimeoutError)/)?.[1]||'OTHER'));
            console.log('FAIL_MESSAGE_HAS_EXPECTED_TO_CONTAIN=' + /to contain|toContain/i.test(msg));
            console.log('FAIL_MESSAGE_HAS_NEGATION=' + /not to contain|not.toContain/i.test(msg));
            console.log('FAIL_MESSAGE_TAGS='+detect(msg).join(','));
            const loc=[...msg.matchAll(/\.(?:test|spec)\.tsx?:(\d+):(\d+)/g)].map(m=>m[1]);
            console.log('ASSERT_LINE_IN_SPEC='+(loc[0]||'UNAVAILABLE'));
          }
          const target='shows actual editable, selectable SQL rather than a placeholder-only code snippet';
          const dir=process.cwd();let found=false;
          function scan(d,depth){
            if(depth>12)return;
            for(const ent of fs.readdirSync(d,{withFileTypes:true})){
              if(['node_modules','.next','.git','.cache','release'].includes(ent.name))continue;
              const p=path.join(d,ent.name);
              if(ent.isDirectory())scan(p,depth+1);
              else if(/\.(?:test|spec)\.[jt]sx?$/.test(ent.name)&&fs.statSync(p).size<160000){
                const src=fs.readFileSync(p,'utf8');
                const index=src.indexOf(target);
                if(index!==-1){
                  found=true;
                  const rest=src.slice(index,index+3300);
                  const chunk=rest.split(/\n\s*(?:it|test)\s*\(/)[0];
                  console.log('TARGET_SPEC_PRESENT=true');
                  console.log('TARGET_SPEC_EXPECT_COUNT='+(chunk.match(/\bexpect\s*\(/g)||[]).length);
                  console.log('TARGET_SPEC_TERMS='+detect(chunk).join(','));
                  const lines=src.split(String.fromCharCode(10));
                  const focus=lines[12]||'';
                  const op=focus.includes('.not.toContain(')?'NOT_CONTAIN':focus.includes('.toContain(')?'CONTAIN':focus.includes('.toMatch(')?'MATCH':focus.includes('.toBe(')?'TO_BE':focus.includes('.toEqual(')?'TO_EQUAL':'OTHER';
                  console.log('ASSERT_LINE_13_OPERATOR='+op);
                  console.log('ASSERT_LINE_13_SAFE_TERMS='+detect(focus).join(','));
                  const tail=focus.split('.toContain(')[1]||''; const desired=tail.length>1 ? tail.slice(1).split(tail[0])[0] : '';
                  console.log('ASSERT_EXPECTED_LENGTH='+desired.length);
                  const tags=['SELECT','TOP','SQL','READ','ReadOnly','readonly','code','placeholder','textarea','button','pre','query','select','edit','copy','aria','disabled','readOnly','نام','کوئری','انتخاب','کپی','واقعی'];
                  console.log('ASSERT_EXPECTED_SAFE_TERMS='+tags.filter(x=>desired.toLowerCase().includes(x.toLowerCase())).join(','));
                  console.log('ASSERT_EXPECTED_ASCII_ONLY='+[...desired].every(c=>c.charCodeAt(0)<128));
                  console.log('TARGET_SPEC_HAS_RENDER_STATIC='+/renderToStaticMarkup/.test(chunk));
                  console.log('TARGET_SPEC_HAS_SOURCE_READ='+/readFileSync|readFile|fetch\(/.test(chunk));
                }
              }
            }
          }
          scan(dir,0);if(!found)console.log('TARGET_SPEC_PRESENT=false');
          '@ | Set-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'classify-private.mjs') -Encoding utf8
          node (Join-Path $env:RUNNER_TEMP 'classify-private.mjs') $report
          if($testExit -ne 0){throw 'V6_TESTS_STILL_FAILING_PRIVATE_OUTPUT_SUPPRESSED'}
          Write-Host 'V6_TESTS_PASS'
      - name: Always disclose isolated scope only
        if: always()
        run: |
          Write-Host 'VALIDATION_SCOPE=PRIVATE_V6_UNIT_TESTS_ONLY'
          Write-Host 'SQL_SERVER=NOT_TESTED; WINDOWS_GUI=NOT_TESTED; NATIVE_BRIDGE=NOT_TESTED; V7=NOT_TESTED'
          Write-Host 'NO_PUBLIC_PRIVATE_SOURCE_OR_BINARIES'
