name: V6 private Excel and SQL integration readiness inventory (NOT V7)
on:
  push:
    branches: ['ci/public-windows-bridge-probe-20261017']
    paths: ['.github/workflows/v6-private-excel-inventory-once.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Verify read-only private V6 staging source and extract only on ephemeral Linux runner
        env:
          GH_TOKEN: ${{ secrets.TF_VALIDATION_READ_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          mkdir -p "$RUNNER_TEMP/tf-v6-private"
          gh release download validation-inputs-20261017 --repo davoodmehraban89/TreasuryFlow-Validation-Private --pattern TreasuryFlow_Validation_Staging_20261017.zip --dir "$RUNNER_TEMP" >/dev/null 2>&1
          echo '9ce46ce2d2a437e08cbf28146b2cf2ac0ed078c71f1aeb537764390cdd3c552f  ' "$RUNNER_TEMP/TreasuryFlow_Validation_Staging_20261017.zip" | sed 's/  / /' >/dev/null
          sum=$(sha256sum "$RUNNER_TEMP/TreasuryFlow_Validation_Staging_20261017.zip" | cut -d' ' -f1)
          test "$sum" = '9ce46ce2d2a437e08cbf28146b2cf2ac0ed078c71f1aeb537764390cdd3c552f'
          unzip -q "$RUNNER_TEMP/TreasuryFlow_Validation_Staging_20261017.zip" -d "$RUNNER_TEMP/tf-v6-private"
          echo "TF_PRIVATE_ROOT=$RUNNER_TEMP/tf-v6-private" >> "$GITHUB_ENV"
          echo 'PRIVATE_STAGING_SHA256_PASS'
      - name: Emit only coarse-grained functionality and test coverage metadata
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/safe-inventory.mjs" <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          const root=process.env.TF_PRIVATE_ROOT;
          const packageJson=JSON.parse(fs.readFileSync(path.join(root,'package.json'),'utf8'));
          const files=[];
          function scan(dir) {
            if(!fs.existsSync(dir))return;
            for(const f of fs.readdirSync(dir,{withFileTypes:true})){
              if(['node_modules','.next','release','.git','.cache'].includes(f.name))continue;
              const full=path.join(dir,f.name);
              if(f.isDirectory())scan(full);
              else if(/[.](?:[cm]?[jt]sx?|mjs)$/.test(f.name)&&fs.statSync(full).size<=150000)files.push({name:f.name,text:fs.readFileSync(full,'utf8')});
            }
          }
          for(const dir of ['src','scripts','native','qa'])scan(path.join(root,dir));
          const subject=files.filter(f=>/excel|xlsx|spreadsheet|workbook|csv/i.test(f.text));
          const test=files.filter(f=>/[.](test|spec)[.]/.test(f.name));
          const excelTests=test.filter(f=>/excel|xlsx|spreadsheet|workbook/i.test(f.text));
          const excelParserDeps=Object.entries({...packageJson.dependencies,...packageJson.devDependencies}).filter(([k])=>['xlsx','exceljs','read-excel-file','sheetjs'].includes(k));
          const features={
            EXCEL_PARSER_DEPENDENCY:excelParserDeps.length>0,
            EXCEL_SOURCE_REFERENCE:subject.some(f=>/excel|xlsx|spreadsheet|workbook/i.test(f.text)),
            EXCEL_TEST_CASE_REFERENCE:excelTests.length>0,
            EXCEL_FILE_UPLOAD_ELEMENT:files.some(f=>/type=['"]file['"]|type:\s*['"]file['"]/.test(f.text)&&/xlsx|excel/i.test(f.text)),
            EXCEL_EXPORT_REFERENCE:files.some(f=>/export|download/i.test(f.text)&&/excel|xlsx/i.test(f.text)),
            SQL_SERVER_LIBRARY_DEPENDENCY:Boolean(packageJson.dependencies?.mssql||packageJson.devDependencies?.mssql),
            SQL_USER_QUERY_EXECUTION_REFERENCE:files.some(f=>/mssql|sql\.connect|new sql\.ConnectionPool/i.test(f.text)),
            MAYAN_NATIVE_SOURCE_PRESENT:fs.existsSync(path.join(root,'native','MayanInterop','Program.cs')),
            V6_STAGE_PACKAGE_VERSION_1_0_1:packageJson.version==='1.0.1'
          };
          for(const [name,value] of Object.entries(features))console.log(name+'='+value);
          console.log('TEST_FILE_COUNT='+test.length);
          console.log('EXCEL_REFERENCING_TEST_FILE_COUNT='+excelTests.length);
          NODE
          node "$RUNNER_TEMP/safe-inventory.mjs"
          echo 'SCOPE=STATIC_FEATURE_INVENTORY_ONLY'
          echo 'NO_PRIVATE_SOURCE_OR_ASSETS_UPLOADED'
