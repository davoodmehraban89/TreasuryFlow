name: TreasuryFlow CI
on:
  push:
    branches: ['main', 'phase-*', 'release-*']
  pull_request:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: npm test -- --reporter=dot
      - run: npx eslint src --no-cache
      - name: Verify production schema contract
        run: npm test -- --run src/platform/persistence/schema-contract.test.ts
      - name: Reject committed secret files
        shell: bash
        run: |
          if git ls-files | grep -E '(^|/)\.env($|\.)' | grep -v '\.env\.production\.example$'; then exit 1; fi
      - run: npm run build
