name: TreasuryFlow CI
on:
  push:
    branches: [main, phase-2-treasury-core]
  pull_request:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test -- --reporter=dot
      - run: npx eslint src --no-cache
      - run: npm run build
