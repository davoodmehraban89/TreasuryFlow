name: V7 SQLite recovery functional security edge independent CI
on:
  push:
    paths:
      - .github/workflows/v7-sqlite-backup-three-angle-once.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  functional:
    name: Functional finance and recovery QA
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm run smoke
      - run: echo GATE_PASS_FULL_FINANCE_RECOVERY_FUNCTIONAL_AND_TYPECHECK
  security:
    name: Code security and backup integrity QA
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: npm audit --omit=dev --audit-level=low
      - run: npm run typecheck
      - run: npx vitest run src/platform/local/verified-sqlite-backup.test.ts src/platform/application/treasury-service-atomic-audit.test.ts
      - run: npx vitest run scripts/treasury-sqlite-recovery.test.ts
      - run: echo GATE_PASS_SECURITY_BACKUP_SNAPSHOT_NO_OVERWRITE
  edge:
    name: WAL racing and corrupted recovery edge QA
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: npx vitest run src/platform/local/verified-sqlite-backup.test.ts src/platform/application/treasury-service-concurrent-guard.test.ts src/platform/application/treasury-service-dispatch-reservation.test.ts
      - run: npx vitest run scripts/treasury-sqlite-recovery.test.ts
      - run: echo GATE_PASS_EDGE_WAL_UNKNOWN_DISPATCHING_AND_FINANCIAL_INTEGER_PRECISION

  windows:
    name: Windows 2022 native SQLite backup and recovery
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Windows native SQLite recovery and CLI negative regressions
        shell: pwsh
        run: |
          & npx.cmd vitest run src/platform/local/verified-sqlite-backup.test.ts scripts/treasury-sqlite-recovery.test.ts
          if($LASTEXITCODE -ne 0){throw 'WINDOWS_NATIVE_SQLITE_RECOVERY_FAILED'}
          Write-Host 'GATE_PASS_REAL_WINDOWS_2022_LOCAL_SQLITE_BACKUP_RESTORE_AND_CLI'
