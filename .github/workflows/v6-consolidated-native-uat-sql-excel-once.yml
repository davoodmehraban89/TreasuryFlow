            $remaining=@(Get-ChildItem -LiteralPath $installDir -Recurse -File -Filter 'TreasuryFlow.exe' -ErrorAction SilentlyContinue)
            if($remaining.Count -eq 0){break}
            Start-Sleep -Seconds 1
          }
          if($remaining.Count -gt 0){throw 'V6_UNINSTALL_LEFT_BINARY'}
