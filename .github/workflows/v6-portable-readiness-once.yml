name: V6 original portable Windows readiness (NOT V7)
on:
  push:
    branches: ['ci/public-windows-bridge-probe-20261017']
    paths: ['.github/workflows/v6-portable-readiness-once.yml']
permissions:
  contents: read
concurrency:
  group: treasuryflow-v6-portable-once
  cancel-in-progress: false
jobs:
  probe:
    name: Windows 2022 - SHA-pinned original V6 portable readiness
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    env:
      BANK_ADAPTER_MODE: disabled
      TREASURYFLOW_ENABLE_MAYAN_EXTERNAL_READ: '0'
      TREASURYFLOW_MAYAN_ENABLE_EXTERNAL_READ: '0'
      TREASURYFLOW_ENABLE_SQL_LAB: '0'
      TREASURYFLOW_DESKTOP_LOCAL: '1'
    steps:
      - name: Retrieve privately and verify original V6 source tools and EXE hashes
        env:
          GH_TOKEN: ${{ secrets.TF_VALIDATION_READ_TOKEN }}
        run: |
          $ErrorActionPreference='Stop'
          if([string]::IsNullOrWhiteSpace($env:GH_TOKEN)){throw 'PRIVATE_TOKEN_NOT_CONFIGURED'}
          $input=Join-Path $env:RUNNER_TEMP 'private-v6-inputs'
          $stage=Join-Path $env:RUNNER_TEMP 'private-v6-stage'
          $unpacked=Join-Path $env:RUNNER_TEMP 'private-v6-exe'
          New-Item -Force -ItemType Directory -Path $input,$stage,$unpacked | Out-Null
          gh release download validation-inputs-20261017 --repo davoodmehraban89/TreasuryFlow-Validation-Private --pattern TreasuryFlow_Validation_Staging_20261017.zip --pattern release-native-v6-final.rar --dir $input *> (Join-Path $env:RUNNER_TEMP 'private-input-download.log')
          if($LASTEXITCODE -ne 0){throw 'PRIVATE_RELEASE_DOWNLOAD_FAILED'}
          $zip=Join-Path $input 'TreasuryFlow_Validation_Staging_20261017.zip'
          $rar=Join-Path $input 'release-native-v6-final.rar'
          if((Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash -ine '9ce46ce2d2a437e08cbf28146b2cf2ac0ed078c71f1aeb537764390cdd3c552f'){throw 'SOURCE_SHA_MISMATCH'}
          if((Get-FileHash -LiteralPath $rar -Algorithm SHA256).Hash -ine 'b8629defc172cef972ad12bb3a2e45a55abed3a5e3a5d991ab2567b877e0c915'){throw 'PORTABLE_ARCHIVE_SHA_MISMATCH'}
          Expand-Archive -LiteralPath $zip -DestinationPath $stage -Force
          if(!(Test-Path -LiteralPath (Join-Path $stage 'qa/windows/portable-v6-smoke.ps1'))){throw 'SMOKE_SCRIPT_NOT_PRESENT'}
          & 7z.exe x -y "-o$unpacked" $rar *> (Join-Path $env:RUNNER_TEMP 'private-extract.log')
          if($LASTEXITCODE -ne 0){throw 'PORTABLE_EXTRACT_FAILED'}
          $exe=Get-ChildItem -LiteralPath $unpacked -Filter 'TreasuryFlow-1.0.1-Windows-x64.exe' -Recurse -File | Select-Object -First 1
          if(!$exe){throw 'PORTABLE_EXE_MISSING'}
          if((Get-FileHash -LiteralPath $exe.FullName -Algorithm SHA256).Hash -ine '99976331f606d8c8ffcf8e9f4895848ff736870790e14b4c7f08a0abdbb7a50a'){throw 'PORTABLE_EXE_SHA_MISMATCH'}
          "TF_PRIVATE_STAGE=$stage" >> $env:GITHUB_ENV
          "TF_PRIVATE_EXE=$($exe.FullName)" >> $env:GITHUB_ENV
          Write-Host 'GATE_PASS_ALL_THREE_PRIVATE_SHA256_CHECKS'
      - name: Run pinned original V6 portable in isolated Windows VM
        timeout-minutes: 15
        run: |
          $ErrorActionPreference='Stop'
          Set-Location -LiteralPath $env:TF_PRIVATE_STAGE
          $log=Join-Path $env:RUNNER_TEMP 'private-v6-portable-run.log'
          $PSNativeCommandUseErrorActionPreference=$false
          $scriptThrew=$false
          try {
            & ./qa/windows/portable-v6-smoke.ps1 -Executable $env:TF_PRIVATE_EXE -ExpectedSha256 '99976331f606d8c8ffcf8e9f4895848ff736870790e14b4c7f08a0abdbb7a50a' -EvidenceDir $env:RUNNER_TEMP *> $log
          } catch { $scriptThrew=$true }
          $exitCode=$LASTEXITCODE
          Write-Host "PORTABLE_SCRIPT_THROWN=$scriptThrew"
          Write-Host "PORTABLE_SCRIPT_NATIVE_EXIT_NONZERO=$($exitCode -ne 0)"
          $logContent=if(Test-Path -LiteralPath $log){Get-Content -LiteralPath $log -Raw}else{''}
          $markers=[ordered]@{
            START_TIMEOUT='timeout|timed.out|timed out'
            PROCESS_EXIT='exited|exit.code|exitcode'
            MISSING_RESOURCE='not.found|missing|ENOENT'
            ACCESS_DENIED='EACCES|EPERM|Access.Denied'
            PORT_IN_USE='EADDRINUSE|already.in.use'
            WIN_PROCESS_ERROR='Start-Process|process.failed|unable.to.start'
            HEALTH_ERROR='health|ready|readiness'
            ELECTRON_ERROR='electron'
            BANK_DISABLED='bankDisabled|BANK_ADAPTER_MODE'
            HASH_MISMATCH='hash.mismatch|SHA256.*fail'
            JSON_ERROR='ConvertFrom-Json|json.parse'
            PS_ERROR='Exception|ParserError|CommandNotFoundException'
          }
          foreach($key in $markers.Keys){Write-Host ("SMOKE_LOG_HAS_"+$key+"="+[bool]($logContent -match $markers[$key]))}
          $evidence=Join-Path $env:RUNNER_TEMP 'v6-portable-runtime.json'
          $hasEvidence=Test-Path -LiteralPath $evidence
          Write-Host "PORTABLE_EVIDENCE_JSON_PRESENT=$hasEvidence"
          if($hasEvidence){
            try{
              $r=Get-Content -LiteralPath $evidence -Raw | ConvertFrom-Json
              $allowed=@('PASS_READY_ONLY','FAIL','FAILED','ERROR','TIMEOUT','NOT_READY')
              $safeStatus=if($allowed -contains [string]$r.status){[string]$r.status}else{'OTHER'}
              Write-Host "PORTABLE_EVIDENCE_STATUS=$safeStatus"
              Write-Host "PORTABLE_EVIDENCE_READY=$([bool]$r.ready)"
              Write-Host "PORTABLE_EVIDENCE_BANK_DISABLED=$([bool]$r.bankDisabled)"
            }catch{throw 'PORTABLE_EVIDENCE_JSON_UNREADABLE'}
          }
          if($scriptThrew -or $exitCode -ne 0){throw 'PORTABLE_V6_READINESS_FAILED'}
          if(!$hasEvidence){throw 'PORTABLE_EVIDENCE_MISSING'}
          if($r.status -ne 'PASS_READY_ONLY' -or !$r.ready -or !$r.bankDisabled){throw 'PORTABLE_READINESS_CONTRACT_FAILED'}
          Write-Host 'GATE_PASS_ORIGINAL_V6_PORTABLE_LOCAL_READY_BANK_DISABLED'
      - name: Publish only scope and privacy controls
        if: always()
        run: |
          Write-Host 'SCOPE=ORIGINAL_V6_PORTABLE_STARTUP_ONLY'
          Write-Host 'REAL_GUI=NOT_TESTED; SQL_SERVER_ENGINE=NOT_TESTED; WINDOWS_CLIPBOARD=NOT_TESTED; EXCEL=NOT_TESTED; INSTALL_UNINSTALL_UPGRADE=NOT_TESTED; V7=NOT_TESTED'
          Write-Host 'PRIVATE_SOURCE_EXE_AND_LOGS=NOT_PUBLISHED'
