name: V7 finance domain deterministic regression
on:
  push:
    paths: [.github/workflows/v7-finance-regression-once.yml]
permissions:
  contents: read
jobs:
  finance:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npx --no-install vitest run src/platform/application/treasury-service-concurrent-guard.test.ts src/platform/application/treasury-service-atomic-audit.test.ts src/platform/application/treasury-service-stale-transition.test.ts
      - run: npm run lint
      - run: npm run build
      - run: echo GATE_PASS_FINANCIAL_TRANSACTIONS_ATOMICITY_AND_RACE_GUARDS
