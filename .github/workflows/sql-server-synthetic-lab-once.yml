name: Synthetic SQL Server 2022 engine and read-only login test (NOT V7)
on:
  push:
    branches: ['ci/public-windows-bridge-probe-20261017']
    paths: ['.github/workflows/sql-server-synthetic-lab-once.yml']
permissions:
  contents: read
concurrency:
  group: treasuryflow-real-sqlserver-synthetic-once
  cancel-in-progress: false
jobs:
  synthetic-sql:
    name: SQL Server 2022 real engine - synthetic fixtures and least privilege
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    env:
      BANK_ADAPTER_MODE: disabled
      TREASURYFLOW_ENABLE_MAYAN_EXTERNAL_READ: '0'
      TREASURYFLOW_MAYAN_ENABLE_EXTERNAL_READ: '0'
      TREASURYFLOW_ENABLE_SQL_LAB: '0'
    steps:
      - name: Launch isolated SQL Server 2022 Developer container without private data
        shell: bash
        run: |
          set -euo pipefail
          sa_pw="A@$(openssl rand -hex 20)z9!"
          reader_pw="Z@$(openssl rand -hex 20)x8!"
          echo "::add-mask::$sa_pw"
          echo "::add-mask::$reader_pw"
          {
            echo "TF_SYNTHETIC_SQL_SA_PASSWORD=$sa_pw"
            echo "TF_SYNTHETIC_SQL_RO_PASSWORD=$reader_pw"
          } >> "$GITHUB_ENV"
          docker pull mcr.microsoft.com/mssql/server:2022-latest > "$RUNNER_TEMP/sql-image.log" 2>&1
          docker run -d --name tf-sql2022-ci -e ACCEPT_EULA=Y -e MSSQL_SA_PASSWORD="$sa_pw" -e MSSQL_PID=Developer -p 127.0.0.1:14333:1433 mcr.microsoft.com/mssql/server:2022-latest > "$RUNNER_TEMP/sql-container-id.log" 2>&1
          echo 'SQL_SERVER_CONTAINER_LAUNCHED'
      - name: Wait for real database engine readiness and seed synthetic records
        shell: bash
        run: |
          set -euo pipefail
          ready=0
          for i in $(seq 1 90); do
            if docker exec tf-sql2022-ci /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$TF_SYNTHETIC_SQL_SA_PASSWORD" -C -b -Q "SELECT 1;" > "$RUNNER_TEMP/sql-ready.log" 2>&1; then ready=1; break; fi
            sleep 5
          done
          if [ "$ready" != 1 ]; then echo 'SQL_ENGINE_READINESS_FAILED'; exit 1; fi
          echo 'GATE_PASS_SQL_SERVER_2022_ENGINE_READY'
          cat > "$RUNNER_TEMP/synthetic-only.sql" <<'SQL'
          CREATE DATABASE TreasuryFlowSyntheticCI;
          GO
          USE TreasuryFlowSyntheticCI;
          GO
          CREATE TABLE dbo.SyntheticTransfers (
            Row_ID int NOT NULL PRIMARY KEY,
            Destination_IBAN varchar(34) NOT NULL,
            Beneficiary_Name nvarchar(100) NOT NULL,
            Amount_IRR bigint NOT NULL CHECK (Amount_IRR > 0),
            Client_Reference varchar(30) NOT NULL UNIQUE,
            Payment_Identifier varchar(30) NULL,
            Deposit_Identifier varchar(30) NULL
          );
          INSERT INTO dbo.SyntheticTransfers
          VALUES (1, 'TF_FAKE_IBAN_00001', N'Synthetic Person A', 1250000, 'TF-CI-SYNTH-00001', 'TF-PAY-00001', 'TF-DEP-00001'),
                 (2, 'TF_FAKE_IBAN_00002', N'Synthetic Person B', 830000, 'TF-CI-SYNTH-00002', NULL, 'TF-DEP-00002');
          GO
          CREATE VIEW dbo.vw_SyntheticTransfers AS
            SELECT Row_ID, Destination_IBAN, Beneficiary_Name, Amount_IRR,
                   Client_Reference, Payment_Identifier, Deposit_Identifier
            FROM dbo.SyntheticTransfers;
          GO
          SQL
          docker cp "$RUNNER_TEMP/synthetic-only.sql" tf-sql2022-ci:/tmp/synthetic-only.sql
          docker exec tf-sql2022-ci /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$TF_SYNTHETIC_SQL_SA_PASSWORD" -C -b -i /tmp/synthetic-only.sql > "$RUNNER_TEMP/sql-seed.log" 2>&1 || { echo 'SYNTHETIC_FIXTURES_SETUP_FAILED'; exit 1; }
          docker exec tf-sql2022-ci /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$TF_SYNTHETIC_SQL_SA_PASSWORD" -C -b -Q "CREATE LOGIN [tf_ci_synthetic_reader] WITH PASSWORD = N'$TF_SYNTHETIC_SQL_RO_PASSWORD', CHECK_POLICY = ON;" > "$RUNNER_TEMP/sql-login.log" 2>&1 || { echo 'READ_ONLY_LOGIN_CREATE_FAILED'; exit 1; }
          docker exec tf-sql2022-ci /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$TF_SYNTHETIC_SQL_SA_PASSWORD" -C -b -d TreasuryFlowSyntheticCI -Q "CREATE USER [tf_ci_synthetic_reader] FOR LOGIN [tf_ci_synthetic_reader]; GRANT SELECT ON OBJECT::dbo.vw_SyntheticTransfers TO [tf_ci_synthetic_reader];" > "$RUNNER_TEMP/sql-grant.log" 2>&1 || { echo 'VIEW_ONLY_GRANT_FAILED'; exit 1; }
          echo 'GATE_PASS_SYNTHETIC_SCHEMA_VIEW_AND_READ_ONLY_ACCOUNT'
      - name: Validate real SELECT plus denial of write and table access as low-privileged login
        shell: bash
        run: |
          set -euo pipefail
          sqlcmd(){
            docker exec tf-sql2022-ci /opt/mssql-tools18/bin/sqlcmd -S localhost -U tf_ci_synthetic_reader -P "$TF_SYNTHETIC_SQL_RO_PASSWORD" -C -b -d TreasuryFlowSyntheticCI -h -1 -W -Q "$1"
          }
          result=$(sqlcmd "SELECT COUNT_BIG(*) FROM dbo.vw_SyntheticTransfers;" 2>"$RUNNER_TEMP/sql-view-error.log") || { echo 'SYNTHETIC_VIEW_SELECT_FAILED'; exit 1; }
          if [[ "$result" != *2* ]]; then echo 'SYNTHETIC_VIEW_COUNT_NOT_TWO'; exit 1; fi
          echo 'GATE_PASS_SQL_VIEW_SELECT_TWO_SYNTHETIC_ROWS'
          failed=0
          sqlcmd "UPDATE dbo.SyntheticTransfers SET Amount_IRR = 1 WHERE Row_ID = 1;" > "$RUNNER_TEMP/sql-deny-update.log" 2>&1 && failed=1 || true
          sqlcmd "INSERT INTO dbo.SyntheticTransfers (Row_ID, Destination_IBAN, Beneficiary_Name, Amount_IRR, Client_Reference) VALUES (3, 'TF_FAKE', N'No', 10, 'TF-BLOCKED');" > "$RUNNER_TEMP/sql-deny-insert.log" 2>&1 && failed=1 || true
          sqlcmd "DELETE FROM dbo.SyntheticTransfers WHERE Row_ID = 1;" > "$RUNNER_TEMP/sql-deny-delete.log" 2>&1 && failed=1 || true
          sqlcmd "SELECT COUNT(*) FROM dbo.SyntheticTransfers;" > "$RUNNER_TEMP/sql-deny-base-select.log" 2>&1 && failed=1 || true
          sqlcmd "DROP VIEW dbo.vw_SyntheticTransfers;" > "$RUNNER_TEMP/sql-deny-drop.log" 2>&1 && failed=1 || true
          if [ "$failed" -ne 0 ]; then echo 'SQL_VIEW_ONLY_PERMISSION_BOUNDARY_FAILED'; exit 1; fi
          echo 'GATE_PASS_SQL_DENY_UPDATE_INSERT_DELETE_BASE_SELECT_DROP'
          docker exec tf-sql2022-ci /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$TF_SYNTHETIC_SQL_SA_PASSWORD" -C -b -d TreasuryFlowSyntheticCI -Q "IF (SELECT COUNT(*) FROM dbo.SyntheticTransfers) <> 2 THROW 50000, 'fixture count changed', 1;" > "$RUNNER_TEMP/sql-post-verify.log" 2>&1 || { echo 'SYNTHETIC_DATA_INTEGRITY_FAILED'; exit 1; }
          echo 'GATE_PASS_SQL_SYNTHETIC_DATA_UNCHANGED'
      - name: Publish exact scope only
        if: always()
        shell: bash
        run: |
          echo 'SQL_ENGINE=REAL_SQL_SERVER_2022_DEVELOPER_CONTAINER'
          echo 'DATA=SYNTHETIC_ONLY; EXTERNAL_MAYAN=DISABLED; BANK=DISABLED'
          echo 'NATIVE_MAYAN_MAPPING=NOT_TESTED; WINDOWS_SQL_ADAPTER=NOT_TESTED; V7=NOT_TESTED'
          echo 'NO_LOG_OR_ARTIFACT_CONTAINS_DB_PASSWORD_OR_REAL_DATA'
